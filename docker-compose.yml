services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-razorsentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-razorsentry_pass}
      POSTGRES_DB: ${POSTGRES_DB:-razorsentry}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorsentry"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  razorsentry:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports
    environment:
      - DATABASE_URL=postgresql://razorsentry:razorsentry_pass@db:5432/razorsentry
      - REDIS_URL=redis://redis:6379
      - PII_SALT=${PII_SALT:-razorsentry-change-this-in-production}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MODEL_PATH=models/lgbm_model.pkl
      - THRESHOLD_PATH=models/threshold.txt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rq_worker:
    build: .
    command: ["rq", "worker", "scoring", "--url", "redis://redis:6379"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql://razorsentry:razorsentry_pass@db:5432/razorsentry
      - REDIS_URL=redis://redis:6379
      - PII_SALT=${PII_SALT:-razorsentry-change-this-in-production}
      - MODEL_PATH=models/lgbm_model.pkl
      - THRESHOLD_PATH=models/threshold.txt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data: